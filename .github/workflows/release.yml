name: Release

# Automatic release stays off until one manual dry run proves the desktop package builds and starts.
# The desktop app now builds `-p monet`; the web front-end, headless CLI and collaboration server
# still carry upstream `figcraft-*` names, so those channels are disabled below until their own
# rename lands (docs/development-model.md).
on:
  # push:
  #   branches: [release]
  workflow_dispatch:
    inputs:
      version:
        description: "Version override for a test run, e.g. 2648.16.0-rc.1 (empty: Cargo.toml)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # Intentionally tracked at @main (not SHA-pinned) so org-wide CI improvements, security fixes, and build optimizations propagate without PR churn across all craftapp repos.
    uses: storytold/craft-common-actions/.github/workflows/release.yml@main
    with:
      app-name: monet
      app-title: Monet
      # Desktop only for now: the web front-end, CLI and server are still the upstream
      # `figcraft-*` crates. Enable each channel after its rename and an end-to-end dry run.
      has-web: false
      has-server: false
      has-freebsd: false
      # Combined Latin presentation and core UI catalog. Required web builds enforce
      # Inter Regular/SemiBold and Noto Sans Georgian Regular after asset-policy filtering.
      craft-fonts-ref: 37827adc41fd165f9a9234ac40f94dbad353aa69
      # The browser has no system fonts: without craft-fonts the web build can't draw text (#885).
      # crates/text/build.rs keeps the web allowlist small (Inter and Georgian).
      web-craft-fonts: false
      version: ${{ inputs.version }}
    secrets:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
      AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
      AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
